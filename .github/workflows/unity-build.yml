name: Unity Build — Idle Farm Harvest Empire

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (Android / iOS / All)'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Android
          - iOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build Android ───────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_target == 'All' ||
      github.event.inputs.build_target == 'Android'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Copy art assets into Unity project
        run: bash setup_assets.sh

      - name: Mark workspace as git safe directory (needed inside Docker)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-Android-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
        with:
          projectPath: game
          targetPlatform: Android
          unityVersion: 2022.3.20f1
          buildName: IdleFarm_HarvestEmpire
          androidExportType: androidPackage
          versioning: None
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
          retention-days: 14

  # ─── Build iOS ───────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (Xcode project)
    runs-on: macos-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_target == 'All' ||
      github.event.inputs.build_target == 'iOS'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Copy art assets into Unity project
        run: bash setup_assets.sh

      - name: Mark workspace as git safe directory (needed inside Docker)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-iOS-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
        with:
          projectPath: game
          targetPlatform: iOS
          unityVersion: 2022.3.20f1
          buildName: IdleFarm_HarvestEmpire
          versioning: None
          allowDirtyBuild: true

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS
          path: build/iOS
          retention-days: 14
