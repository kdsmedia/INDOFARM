<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>IndoFarm Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- Capacitor-bundled Android game runtime imports -->
  <!-- All dependencies are served from local vendor files — no CDN required at runtime.
       This prevents crashes on Android WebView when network is unavailable at startup. -->
  <script type="importmap">
  {
    "imports": {
      "three":              "./vendor/three/three.module.min.js",
      "three/addons/":      "./vendor/three/",
      "firebase/app":       "./vendor/firebase/firebase-app.js",
      "firebase/auth":      "./vendor/firebase/firebase-auth.js",
      "firebase/firestore": "./vendor/firebase/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <!-- Root aplikasi game — diisi oleh lobby.js + ui.js -->
  <div id="app"></div>

  <!-- Entry point utama (ES6 module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
