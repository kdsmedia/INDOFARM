<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>IndoFarm Adventure</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- model-viewer — untuk 3D karakter di lobby & asset browser -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- Import Map: Three.js + Firebase v10 Modular ESM -->
  <script type="importmap">
  {
    "imports": {
      "three":                  "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/":          "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
      "firebase/app":           "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
      "firebase/auth":          "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
      "firebase/firestore":     "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <!-- Root aplikasi game — diisi oleh lobby.js + ui.js -->
  <div id="app"></div>

  <!-- Entry point utama (ES6 module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
